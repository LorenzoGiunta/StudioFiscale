# nginx per la SPA: serve i file statici e inoltra API e WebSocket al backend.
# "backend" è il nome del servizio nel docker-compose (risolto dalla rete interna).

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Allineato a spring.servlet.multipart.max-request-size del backend
    client_max_body_size 25m;

    # API REST
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket della chat (SockJS/STOMP): serve l'upgrade del protocollo
    location /ws/ {
        proxy_pass         http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;    # connessioni lunghe, non vanno chiuse per inattività
    }

    # Asset con hash nel nome: cache lunga
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Routing lato client (React Router): tutto il resto torna a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
