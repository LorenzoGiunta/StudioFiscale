spring.application.name=gestionalec

# =====================================================================
# Configurazione COMUNE a tutti gli ambienti.
#
# Tutto ciò che cambia tra un ambiente e l'altro è letto da variabili
# d'ambiente (vedi .env.example), con un default pensato per lo sviluppo
# locale. I profili aggiungono solo ciò che è specifico:
#   - dev    (default): log SQL, cartelle relative, origini localhost
#   - docker : host dei servizi del docker-compose, volumi, reverse proxy
# =====================================================================
spring.profiles.default=dev

# Spegnimento ordinato: Tomcat smette di accettare richieste e si attende che
# quelle in corso (e i task asincroni: email, notifiche) finiscano, fino a 30 s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Dimensionamento esplicito dei thread che contendono le connessioni al DB.
# Tomcat: 50 thread bastano ampiamente per un'applicazione di questo tipo.
# HikariCP: 20 connessioni servono Tomcat, i pool asincroni e i job schedulati.
server.tomcat.threads.max=50
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Scheduler dei job @Scheduled (vedi SchedulingConfig): due thread, così un job
# lungo non fa slittare gli altri; allo spegnimento si attende il job in corso
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduler-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# ─── Database ────────────────────────────────────────────────────────────────
# Credenziali e segreti letti da variabili d'ambiente (vedi .env.example).
# URL e username hanno un default di sviluppo; i SEGRETI (password DB e JWT) NON
# hanno default: se la variabile d'ambiente manca l'app NON parte. Questo evita
# di usare in produzione valori pubblici noti (finiti su git).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestionalec?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Il log delle query è attivo solo nel profilo dev
spring.jpa.show-sql=false

# La sessione Hibernate NON resta aperta durante il rendering della risposta:
# le connessioni al DB si liberano prima e gli accessi LAZY fuori dai service
# falliscono subito invece di nascondere query N+1. Richiede che i service
# carichino (fetch/inizializzazione) tutto ciò che serve ai mapper.
spring.jpa.open-in-view=false

# Lo schema è gestito da Flyway (src/main/resources/db/migration): Hibernate si
# limita a VERIFICARE che le entità corrispondano alle tabelle, senza toccarle.
# I dati sopravvivono ai riavvii; ogni modifica allo schema è una nuova
# migrazione versionata (V3__..., V4__...).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Se il DB esiste già con tabelle ma senza storico Flyway (creato dal vecchio
# create-drop), la prima volta va svuotato: DROP DATABASE gestionalec; poi
# riavviare. createDatabaseIfNotExist=true nell'URL lo ricrea vuoto.
spring.flyway.baseline-on-migrate=false

# Nessuno script SQL eseguito da Spring all'avvio: il seed è la migrazione V2
spring.sql.init.mode=never

# ─── Sicurezza ───────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
# 86400000 ms = 24 ore
jwt.expiration=86400000

# Origini del frontend ammesse (CORS e handshake WebSocket), separate da virgola
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ─── Email ───────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
# Username e App Password Gmail: impostare via variabili d'ambiente, mai nel codice
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Timeout SMTP (ms): senza, JavaMail attende all'infinito e un server che non
# risponde blocca per sempre i thread del pool email
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Invio email attivo solo se configurato (default off: evita errori SMTP in locale/demo)
app.email.enabled=${EMAIL_ENABLED:true}

# ─── File caricati ───────────────────────────────────────────────────────────
# Cartella dei documenti: relativa in sviluppo, volume assoluto nei container
file.upload-dir=${UPLOAD_DIR:uploads/documenti}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ─── Applicazione ────────────────────────────────────────────────────────────
# Non strettamente necessario, ma lascia la porta aperta
spring.websocket.client.user-destination-prefix=/user

# URL base del frontend React usato per costruire i link nelle email (inviti, reset password)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Validità del link di recupero password (minuti)
app.password-reset.durata-minuti=60
