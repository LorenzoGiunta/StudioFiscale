# =====================================================================
# Profilo DOCKER: attivato dal docker-compose con SPRING_PROFILES_ACTIVE=docker.
#
# I servizi si raggiungono per nome di container (mysql), i file caricati
# vivono su un volume, il frontend è servito da nginx sulla stessa origine
# e fa da reverse proxy verso /api e /ws. Le variabili restano sovrascrivibili
# dal docker-compose / .env; qui ci sono solo i default sensati per i container.
# =====================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/gestionalec?createDatabaseIfNotExist=true}

# Volume dei documenti (dichiarato nel docker-compose)
file.upload-dir=${UPLOAD_DIR:/data/uploads}

# nginx pubblica il frontend su questa origine e inoltra le chiamate API:
# è l'origine da ammettere e quella da usare nei link delle email
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}
app.frontend-url=${FRONTEND_URL:http://localhost:8081}

# Dietro un reverse proxy: schema/host reali letti dagli header X-Forwarded-*
server.forward-headers-strategy=framework

# Log più sobrio
logging.level.root=INFO
logging.level.com.tesi.gestionalec=INFO
